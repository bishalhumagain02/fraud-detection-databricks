[project]
name = "fraud-detection-databricks"
version = "0.1.0"
description = "Real-time fraud detection pipeline on Databricks Free Edition"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "databricks-sdk>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
ml = [
    "lightgbm>=4.0",
    "mlflow>=2.10",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
